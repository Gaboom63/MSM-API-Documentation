<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
	<link rel="stylesheet" href="CSS/styles.css"></link>
	<link rel="icon" type="image/x-icon" href="images/Important/mammoticon.png">
	<title>MSM API Documentation</title>
</head>
<body>
	<h1 id="title">My Singing Monsters <br> <i>API Documentation</i></h1>

	<!-- <button></button> -->

	<div id="mainContainer">

		<div id="monsterImgContainer"><img id="drawImg"></div>	
		<div id="nameContainer">
			<p id="monsterName">Epic Spunge</p>
		</div>
		<button id="tryCommand">Try Command!</button>

		<div id="infoDisplay">
			<h2 id="infoTitle" style="text-align: center; color: lightgrey;">FAILED TO LOAD DOCUMENT!</h2>
			<p id="infoDescription" style="text-align: center; color: lightgrey;"></p>
		</div>

		<div id="fakeConsole">
			<p style="display: inline-block; color: #8AE234; padding-left: 20px; font-size: 12px;">MSM@API-Terminal: ~$ </p> 
			<p style="display: inline-block; color: white; font-size: 10px; word-wrap: break-word;" id="terminalCommand"><i>Commands Will Appear Here</i></p>
			<p id="command-output"></p>
		</div>	

		<div id="infoContainer"> <input id="search" placeholder="Search Docs Here!"> <br> <p style="text-decoration: underline; text-underline-offset: 4px;"> ❖ - Documents - ❖</p> </div>
	</div>

	<script src="JS/load_api.js"></script>
	<script src="JS/documents.js"></script>
	<script src="JS/monsters.js"></script>
</body>
</html>
